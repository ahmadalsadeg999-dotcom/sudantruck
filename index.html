<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>شحنات السعودية — السودان</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
<style>
  :root {
    --bg: #101613; --surface: #171F1B; --surface-2: #1E2822; --surface-3: #26332B; --border: #2E3B33;
    --text: #EAEFE9; --text-muted: #8FA096;
    --accent: #D9A441; --accent-soft: rgba(217,164,65,0.16);
    --green: #5FBF8F; --green-soft: rgba(95,191,143,0.14);
    --danger: #E06B6B; --danger-soft: rgba(224,107,107,0.14);
    --blue: #6FA8DC; --blue-soft: rgba(111,168,220,0.14);
    --radius-s: 8px; --radius-m: 12px; --radius-l: 18px;
    --font: 'Cairo','Tahoma',sans-serif; --mono: 'IBM Plex Mono', ui-monospace, Menlo, monospace;
  }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) {
      --bg:#F5F3EE; --surface:#FFFFFF; --surface-2:#FBFAF6; --surface-3:#F1EEE6; --border:#DFDACD;
      --text:#20261F; --text-muted:#6B7364;
      --accent-soft: rgba(217,164,65,0.14); --green-soft: rgba(60,140,100,0.12);
      --danger-soft: rgba(200,60,60,0.10); --blue-soft: rgba(50,100,170,0.10);
    }
  }
  :root[data-theme="light"] {
    --bg:#F5F3EE; --surface:#FFFFFF; --surface-2:#FBFAF6; --surface-3:#F1EEE6; --border:#DFDACD;
    --text:#20261F; --text-muted:#6B7364;
    --accent-soft: rgba(217,164,65,0.14); --green-soft: rgba(60,140,100,0.12);
    --danger-soft: rgba(200,60,60,0.10); --blue-soft: rgba(50,100,170,0.10);
  }
  * { box-sizing:border-box; }
  html,body{ margin:0; padding:0; }
  body{ background:var(--bg); color:var(--text); font-family:var(--font); min-height:100vh; -webkit-font-smoothing:antialiased; }
  button{ font-family:var(--font); cursor:pointer; }
  input,select,textarea{ font-family:var(--font); }

  .login-wrap{ min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px; }
  .login-card{ width:100%; max-width:380px; background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-l); padding:32px 28px; }
  .login-mark{ width:52px; height:52px; border-radius:14px; background:linear-gradient(155deg,var(--accent),#B9822B); display:flex; align-items:center; justify-content:center; margin-bottom:16px; }
  .login-mark svg{ width:26px; height:26px; }
  .login-card h2{ margin:0 0 4px; font-size:19px; }
  .login-card .sub{ font-size:12.5px; color:var(--text-muted); margin-bottom:22px; }
  .field{ margin-bottom:13px; }
  .field label{ display:block; font-size:12px; font-weight:700; color:var(--text-muted); margin-bottom:5px; }
  .field input, .field select, .field textarea{ width:100%; background:var(--surface-2); border:1px solid var(--border); color:var(--text); padding:10px 12px; border-radius:var(--radius-s); font-size:13.5px; }
  .field textarea{ resize:vertical; min-height:56px; }
  .btn{ display:inline-flex; align-items:center; justify-content:center; gap:7px; padding:10px 16px; border-radius:var(--radius-s); border:1px solid var(--border); background:var(--surface-2); color:var(--text); font-size:13px; font-weight:700; }
  .btn:hover{ background:var(--surface-3); }
  .btn-primary{ background:var(--accent); border-color:var(--accent); color:#241705; width:100%; padding:11px 16px; }
  .btn-primary:hover{ filter:brightness(1.07); }
  .btn-ghost{ background:transparent; border-color:transparent; color:var(--text-muted); }
  .btn-ghost:hover{ color:var(--text); background:var(--surface-2); }
  .btn-danger-ghost{ background:transparent; border-color:transparent; color:var(--danger); }
  .login-error{ background:var(--danger-soft); color:var(--danger); font-size:12.5px; padding:9px 12px; border-radius:var(--radius-s); margin-bottom:14px; display:none; }
  .login-error.show{ display:block; }
  .login-switch{ text-align:center; font-size:12px; color:var(--text-muted); margin-top:14px; }
  .login-switch a{ color:var(--accent); font-weight:700; cursor:pointer; text-decoration:none; }

  .app{ display:none; min-height:100vh; }
  .app.show{ display:flex; flex-direction:column; }
  .topnav{ display:flex; align-items:center; justify-content:space-between; padding:14px 22px; border-bottom:1px solid var(--border); background:var(--surface); flex-wrap:wrap; gap:10px; }
  .brand{ display:flex; align-items:center; gap:10px; }
  .brand-mark{ width:32px; height:32px; border-radius:9px; background:linear-gradient(155deg,var(--accent),#B9822B); display:flex; align-items:center; justify-content:center; overflow:hidden; }
  .brand-mark.has-logo{ width:64px; height:64px; background:#fff; border:1px solid var(--border); padding:5px; }
  .brand-mark svg{ width:16px; height:16px; }
  .brand-mark img{ width:100%; height:100%; object-fit:contain; }
  .brand b{ font-size:14.5px; font-weight:800; display:block; }
  .brand span{ font-size:11px; color:var(--text-muted); }
  .topnav-right{ display:flex; align-items:center; gap:8px; }
  .tabs{ display:flex; gap:4px; padding:0 22px; border-bottom:1px solid var(--border); background:var(--surface); overflow-x:auto; }
  .tab{ padding:12px 14px; font-size:13px; font-weight:700; color:var(--text-muted); background:none; border:none; border-bottom:2px solid transparent; white-space:nowrap; }
  .tab.active{ color:var(--accent); border-bottom-color:var(--accent); }
  .main{ flex:1; padding:22px; max-width:1200px; width:100%; margin:0 auto; }

  .stats-row{ display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:12px; margin-bottom:20px; }
  .stat-card{ background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-m); padding:15px; position:relative; overflow:hidden; }
  .stat-card .bar{ position:absolute; inset-inline-start:0; top:0; bottom:0; width:3px; }
  .stat-card .num{ font-size:23px; font-weight:800; }
  .stat-card .lbl{ font-size:11.5px; color:var(--text-muted); margin-top:3px; }

  .toolbar{ display:flex; gap:10px; flex-wrap:wrap; align-items:center; justify-content:space-between; margin-bottom:14px; }
  .filters{ display:flex; gap:8px; flex-wrap:wrap; }
  .filters select, .filters input{ background:var(--surface-2); border:1px solid var(--border); color:var(--text); padding:8px 10px; border-radius:var(--radius-s); font-size:12.5px; }

  .panel{ background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-m); overflow:hidden; }
  .table-wrap{ overflow-x:auto; }
  table{ width:100%; border-collapse:collapse; font-size:13px; }
  th{ text-align:right; color:var(--text-muted); font-weight:600; font-size:11px; padding:9px 12px; white-space:nowrap; border-bottom:1px solid var(--border); }
  td{ padding:11px 12px; border-bottom:1px solid var(--border); white-space:nowrap; }
  tbody tr:hover{ background:var(--surface-2); }
  tbody tr:last-child td{ border-bottom:none; }
  .mono{ font-family:var(--mono); font-size:12.5px; }
  .cell-strong{ font-weight:700; }
  .cell-muted{ color:var(--text-muted); font-size:12px; }

  .badge{ display:inline-flex; align-items:center; gap:5px; padding:4px 9px; border-radius:999px; font-size:11.5px; font-weight:700; white-space:nowrap; }
  .dot{ width:6px; height:6px; border-radius:50%; }
  select.status-select{ border:none; padding:5px 8px; border-radius:7px; font-size:12px; font-weight:700; font-family:var(--font); }
  .zone-chip{ display:inline-flex; align-items:center; gap:6px; padding:4px 10px; border-radius:999px; background:var(--surface-3); font-size:12px; font-weight:700; }
  .zone-chip:hover{ background:var(--accent-soft); color:var(--accent); }

  .icon-btn{ background:transparent; border:none; color:var(--text-muted); padding:5px; border-radius:6px; }
  .icon-btn:hover{ color:var(--text); background:var(--surface-3); }
  .icon-btn svg{ width:15px; height:15px; display:block; }
  .action-btn{ display:inline-flex; align-items:center; gap:5px; padding:6px 10px; border-radius:7px; border:1px solid var(--border); background:var(--surface-2); color:var(--text); font-size:11.5px; font-weight:700; }
  .action-btn:hover{ background:var(--surface-3); border-color:var(--accent); }
  .action-btn svg{ width:13px; height:13px; }
  .action-row{ display:flex; gap:6px; align-items:center; }

  .empty-state{ padding:46px 20px; text-align:center; color:var(--text-muted); }
  .empty-state svg{ width:36px; height:36px; margin-bottom:10px; opacity:0.5; }
  .empty-state p{ margin:4px 0 14px; font-size:13px; }

  .overlay{ position:fixed; inset:0; background:rgba(6,9,7,0.55); backdrop-filter:blur(2px); display:none; align-items:flex-start; justify-content:center; padding:5vh 16px; z-index:50; overflow-y:auto; }
  .overlay.open{ display:flex; }
  .modal{ background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-l); width:100%; max-width:520px; padding:20px; animation:pop .16s ease; }
  @keyframes pop{ from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:none;} }
  .modal h3{ margin:0 0 3px; font-size:16px; }
  .modal-sub{ font-size:12px; color:var(--text-muted); margin-bottom:16px; }
  .field-row{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .modal-actions{ display:flex; justify-content:flex-end; gap:8px; margin-top:18px; }

  .toast-wrap{ position:fixed; bottom:18px; left:18px; z-index:80; display:flex; flex-direction:column; gap:8px; }
  .toast{ background:var(--surface-3); border:1px solid var(--border); color:var(--text); padding:11px 15px; border-radius:var(--radius-s); font-size:13px; font-weight:600; box-shadow:0 6px 18px rgba(0,0,0,0.25); animation:pop .16s ease; }

  .settings-grid{ display:grid; grid-template-columns:1fr 1fr; gap:16px; }
  @media (max-width:760px){ .settings-grid{ grid-template-columns:1fr; } .field-row{ grid-template-columns:1fr; } }
  .logo-preview{ width:100px; height:100px; border-radius:10px; object-fit:contain; border:1px solid var(--border); background:#fff; padding:8px; }
  .card-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:12px; }
  .loading-veil{ position:fixed; inset:0; background:var(--bg); display:flex; align-items:center; justify-content:center; z-index:100; color:var(--text-muted); font-size:13px; }
</style>
</head>
<body>

<div class="loading-veil" id="loadingVeil">جارِ الاتصال بالخادم...</div>

<div class="login-wrap" id="loginWrap" style="display:none;">
  <div class="login-card">
    <div class="login-mark"><svg viewBox="0 0 24 24" fill="none"><path d="M3 12l7-8 4 4-7 8-4-4z" stroke="#241705" stroke-width="1.8" stroke-linejoin="round"/><path d="M13 9l3-3 5 5-3 3" stroke="#241705" stroke-width="1.8" stroke-linejoin="round"/></svg></div>
    <h2 id="loginTitle">تسجيل الدخول</h2>
    <div class="sub" id="loginSub">إدارة شحنات السعودية — السودان</div>
    <div class="login-error" id="loginError"></div>
    <div id="loginFormBody"></div>
  </div>
</div>

<div class="app" id="app">
  <div class="topnav">
    <div class="brand">
      <div class="brand-mark" id="brandMark"><svg viewBox="0 0 24 24" fill="none"><path d="M3 12l7-8 4 4-7 8-4-4z" stroke="#241705" stroke-width="1.8" stroke-linejoin="round"/><path d="M13 9l3-3 5 5-3 3" stroke="#241705" stroke-width="1.8" stroke-linejoin="round"/></svg></div>
      <div><b id="brandName">شركة النقل</b><span>السعودية → السودان</span></div>
    </div>
    <div class="topnav-right">
      <button class="btn btn-ghost" id="themeBtn">تبديل المظهر</button>
      <button class="btn btn-ghost" id="logoutBtn">تسجيل الخروج</button>
    </div>
  </div>
  <div class="tabs" id="tabs">
    <button class="tab active" data-page="dashboard">الشحنات</button>
    <button class="tab" data-page="trips">الرحلات</button>
    <button class="tab" data-page="customers">العملاء</button>
    <button class="tab" data-page="expenses">المصاريف</button>
    <button class="tab" data-page="settings">الإعدادات</button>
  </div>
  <div class="main" id="pageContent"></div>
</div>

<div class="overlay" id="overlay"><div class="modal" id="modalBox"></div></div>
<div class="toast-wrap" id="toastWrap"></div>

<script>
/* ================= Supabase ================= */
const SUPABASE_URL = 'https://ngufhuuhrspschvtvrun.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5ndWZodXVocnNwc2NodnR2cnVuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk1NTE5NzAsImV4cCI6MjEwNTEyNzk3MH0.HnPuuQzv6iQTxSC_3ODP01ufKzclhUcTzPMEXkb8ajE';
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let DATA = { company:{name:'شركة النقل',phone:'',origin_city:'',logo_url:''}, shipments:[], customers:[], expenses:[], trips:[] };

function uid(p){ return p + Math.random().toString(36).slice(2,8); }
function money(n){ return (Number(n)||0).toLocaleString('ar-SA') + ' ر.س'; }
function fmtDate(iso){ if(!iso) return '—'; const d=new Date(iso); return d.toLocaleDateString('ar-SA',{month:'short',day:'numeric',year:'numeric'}); }
function fmtDateTime(iso){ if(!iso) return '—'; const d=new Date(iso); return d.toLocaleDateString('ar-SA',{month:'short',day:'numeric'}) + ' ' + d.toLocaleTimeString('ar-SA',{hour:'2-digit',minute:'2-digit'}); }
function nowForInput(){ const d=new Date(); d.setMinutes(d.getMinutes()-d.getTimezoneOffset()); return d.toISOString().slice(0,16); }
function todayForInput(){ const d=new Date(); d.setMinutes(d.getMinutes()-d.getTimezoneOffset()); return d.toISOString().slice(0,10); }
function waLink(phone, text, countryCode){
  if(!phone) return '#';
  const cc = countryCode || '249';
  let digits = String(phone).replace(/\D/g,'');
  if (digits.startsWith('0')) digits = cc + digits.slice(1);
  else if (!digits.startsWith(cc) && digits.length<=10) digits = cc + digits;
  return `https://wa.me/${digits}?text=${encodeURIComponent(text||'')}`;
}
function toast(msg){
  const wrap = document.getElementById('toastWrap');
  const el = document.createElement('div'); el.className='toast'; el.textContent=msg;
  wrap.appendChild(el);
  setTimeout(()=>{ el.style.opacity='0'; el.style.transition='opacity .25s'; setTimeout(()=>el.remove(),250); }, 2600);
}
function nextTrackingNumber(){
  const nums = DATA.shipments.map(s=>{ const m=/KSA-SD-(\d+)/.exec(s.tracking||''); return m?parseInt(m[1],10):0; });
  const max = nums.length ? Math.max(...nums) : 200;
  return 'KSA-SD-' + (max+1);
}
function nextTripNumberVal(){
  const nums = DATA.trips.map(t=>{ const m=/TRIP-(\d+)/.exec(t.number||''); return m?parseInt(m[1],10):0; });
  const max = nums.length ? Math.max(...nums) : 0;
  return 'TRIP-' + (max+1);
}

/* ================= Status ================= */
const STATUS = {
  preparing:   { label:'قيد التجهيز',      color:'var(--text-muted)', soft:'var(--surface-3)' },
  shipped:     { label:'غادرت على الشاحنة', color:'var(--blue)',  soft:'var(--blue-soft)' },
  customs:     { label:'في الجمارك',        color:'var(--accent)',soft:'var(--accent-soft)' },
  arrived:     { label:'وصلت السودان',      color:'var(--green)', soft:'var(--green-soft)' },
  delivered:   { label:'تم التسليم',        color:'var(--green)', soft:'var(--green-soft)' },
  cancelled:   { label:'ملغاة',             color:'var(--danger)',soft:'var(--danger-soft)' },
};
const STATUS_ORDER = ['preparing','shipped','customs','arrived','delivered','cancelled'];
const TRIP_STATUS = {
  preparing: { label:'قيد التجهيز', color:'var(--text-muted)', soft:'var(--surface-3)' },
  ongoing:   { label:'جارية',        color:'var(--accent)', soft:'var(--accent-soft)' },
  completed: { label:'مكتملة',       color:'var(--green)', soft:'var(--green-soft)' },
};
const TRIP_STATUS_ORDER = ['preparing','ongoing','completed'];
const EXP_CATEGORIES = { fuel:'وقود', customs:'جمارك', tolls:'رسوم طريق', maintenance:'صيانة', other:'أخرى' };

function badge(s){ const st=STATUS[s]||STATUS.preparing; return `<span class="badge" style="background:${st.soft};color:${st.color}"><span class="dot" style="background:${st.color}"></span>${st.label}</span>`; }
function statusSelect(id, current){
  const opts = STATUS_ORDER.map(k=>`<option value="${k}" ${k===current?'selected':''}>${STATUS[k].label}</option>`).join('');
  const s = STATUS[current]||STATUS.preparing;
  return `<select class="status-select" style="background:${s.soft};color:${s.color}" onchange="updateStatus('${id}', this.value)">${opts}</select>`;
}

/* ================= Auth ================= */
function renderLogin(mode){
  document.getElementById('loginWrap').style.display='flex';
  document.getElementById('loginError').classList.remove('show');
  const body = document.getElementById('loginFormBody');
  if (mode === 'signup'){
    document.getElementById('loginTitle').textContent = 'إنشاء حساب جديد';
    document.getElementById('loginSub').textContent = 'أول مرة تستخدم البرنامج؟ اعمل حسابك';
    body.innerHTML = `
      <div class="field"><label>البريد الإلكتروني</label><input id="setupEmail" type="email" placeholder="example@email.com"></div>
      <div class="field"><label>كلمة السر</label><input id="setupPass" type="password" placeholder="6 أحرف على الأقل"></div>
      <button class="btn btn-primary" onclick="doSignup()">إنشاء الحساب</button>
      <div class="login-switch">عندك حساب بالفعل؟ <a onclick="renderLogin('login')">سجّل دخولك</a></div>
    `;
  } else {
    document.getElementById('loginTitle').textContent = 'تسجيل الدخول';
    document.getElementById('loginSub').textContent = DATA.company.name || 'إدارة شحنات السعودية — السودان';
    body.innerHTML = `
      <div class="field"><label>البريد الإلكتروني</label><input id="loginEmail" type="email" placeholder="example@email.com"></div>
      <div class="field"><label>كلمة السر</label><input id="loginPass" type="password"></div>
      <button class="btn btn-primary" onclick="doLogin()">دخول</button>
      <div class="login-switch">أول مرة تستخدم البرنامج؟ <a onclick="renderLogin('signup')">أنشئ حساب جديد</a></div>
    `;
    document.getElementById('loginPass').addEventListener('keydown', e=>{ if(e.key==='Enter') doLogin(); });
  }
}
function showLoginError(msg){ const el=document.getElementById('loginError'); el.textContent=msg; el.classList.add('show'); }

async function doSignup(){
  const email = document.getElementById('setupEmail').value.trim();
  const password = document.getElementById('setupPass').value;
  if(!email || password.length<6){ showLoginError('أدخل بريدًا صحيحًا وكلمة سر لا تقل عن 6 أحرف'); return; }
  const { data, error } = await sb.auth.signUp({ email, password });
  if (error){ showLoginError(error.message); return; }
  if (data.session){ afterAuth(); }
  else { showLoginError(''); document.getElementById('loginError').classList.remove('show'); toast('تم إنشاء الحساب — تحقق من بريدك لتأكيده إن طُلب منك ذلك، ثم سجّل دخولك'); renderLogin('login'); }
}
async function doLogin(){
  const email = document.getElementById('loginEmail').value.trim();
  const password = document.getElementById('loginPass').value;
  const { error } = await sb.auth.signInWithPassword({ email, password });
  if (error){ showLoginError('البريد أو كلمة السر غير صحيحة'); return; }
  afterAuth();
}
document.getElementById('logoutBtn').addEventListener('click', async ()=>{
  await sb.auth.signOut();
  document.getElementById('app').classList.remove('show');
  renderLogin('login');
});

async function afterAuth(){
  document.getElementById('loginWrap').style.display='none';
  document.getElementById('loadingVeil').style.display='flex';
  document.getElementById('loadingVeil').textContent = 'جارِ تحميل بياناتك...';
  await loadAllData();
  document.getElementById('loadingVeil').style.display='none';
  document.getElementById('app').classList.add('show');
  updateBrand();
  goto('dashboard');
}

/* ================= Data loading ================= */
async function loadAllData(){
  const [company, shipments, customers, expenses, trips] = await Promise.all([
    sb.from('company_settings').select('*').eq('id',1).maybeSingle(),
    sb.from('shipments').select('*').order('created_at',{ascending:false}),
    sb.from('customers').select('*').order('created_at',{ascending:false}),
    sb.from('expenses').select('*').order('date',{ascending:false}),
    sb.from('trips').select('*').order('date',{ascending:false}),
  ]);
  DATA.company = company.data || { name:'شركة النقل', phone:'', origin_city:'', logo_url:'' };
  DATA.shipments = shipments.data || [];
  DATA.customers = customers.data || [];
  DATA.expenses = expenses.data || [];
  DATA.trips = trips.data || [];
  if (shipments.error) toast('تعذّر تحميل الشحنات: '+shipments.error.message);
}
async function refetch(table){
  const orderCol = table==='expenses' ? 'date' : 'created_at';
  const { data, error } = await sb.from(table).select('*').order(orderCol,{ascending:false});
  if (error){ toast('خطأ في تحميل البيانات: '+error.message); return; }
  DATA[table] = data || [];
}

let filters = { status:'', q:'', trip:'' };
function renderDashboard(){
  const s = DATA.shipments;
  const counts = {}; STATUS_ORDER.forEach(k=>counts[k]=0);
  s.forEach(x=>counts[x.status]=(counts[x.status]||0)+1);
  const active = counts.shipped + counts.customs + counts.arrived;
  const totalValue = s.reduce((a,x)=>a+(Number(x.price)||0),0);
  const cards = [
    { num:s.length, lbl:'إجمالي الشحنات', color:'var(--blue)' },
    { num:counts.preparing, lbl:'قيد التجهيز', color:'var(--text-muted)' },
    { num:active, lbl:'على الطريق / بالجمارك', color:'var(--accent)' },
    { num:counts.delivered, lbl:'تم التسليم', color:'var(--green)' },
    { num:money(totalValue), lbl:'إجمالي قيمة الشحن', color:'var(--accent)' },

async function updateStatus(id, status){
  const payload = { status };
  if (status==='delivered') payload.delivered_at = new Date().toISOString();
  const { error } = await sb.from('shipments').update(payload).eq('id', id);
  if (error){ toast('خطأ: '+error.message); return; }
  const x = DATA.shipments.find(s=>s.id===id); if(x) Object.assign(x, payload);
  toast('تم تحديث الحالة');
}
async function deleteShipment(id){
  const x = DATA.shipments.find(s=>s.id===id); if(!x) return;
  if(!confirm(`حذف الشحنة ${x.tracking}؟`)) return;
  const { error } = await sb.from('shipments').delete().eq('id', id);
  if (error){ toast('خطأ: '+error.message); return; }
  DATA.shipments = DATA.shipments.filter(s=>s.id!==id);
  renderTable(); toast('تم الحذف');
}

function fillFromCustomer(id){
  const c = DATA.customers.find(x=>x.id===id); if(!c) return;
  document.getElementById('fClient').value = c.name||'';
  document.getElementById('fPhone').value = c.phone||'';
  document.getElementById('fCity').value = c.city||'';

}
async function saveShipment(id){
  const client = document.getElementById('fClient').value.trim();
  const city = document.getElementById('fCity').value.trim();
  if(!client){ toast('اسم العميل مطلوب'); return; }
  if(!city){ toast('المدينة في السودان مطلوبة'); return; }
  const btn = document.getElementById('saveShipmentBtn'); btn.disabled = true;
  const newTripId = document.getElementById('fShipmentTrip').value || null;
  const payload = {
    client, city,
    phone: document.getElementById('fPhone').value.trim(),
    sender_name: document.getElementById('fSenderName').value.trim(),
    sender_phone: document.getElementById('fSenderPhone').value.trim(),
    origin: document.getElementById('fOrigin').value.trim(),
    address: document.getElementById('fAddress').value.trim(),
    pickup_at: document.getElementById('fPickup').value ? new Date(document.getElementById('fPickup').value).toISOString() : null,
    eta: document.getElementById('fEta').value || null,
    description: document.getElementById('fDesc').value.trim(),
    weight: Number(document.getElementById('fWeight').value)||0,
    pieces: Number(document.getElementById('fPieces').value)||1,
    price: Number(document.getElementById('fPrice').value)||0,
    payment: document.getElementById('fPayment').value,
    trip_id: newTripId,
  };
  if (id){
    const { error } = await sb.from('shipments').update(payload).eq('id', id);
    btn.disabled = false;
    if (error){ toast('خطأ: '+error.message); return; }
    toast('تم حفظ التعديلات');
  } else {
    payload.tracking = nextTrackingNumber();
    payload.status = 'preparing';
    const { data, error } = await sb.from('shipments').insert(payload).select().single();
    btn.disabled = false;
    if (error){ toast('خطأ: '+error.message); return; }
    const saveCustomerBox = document.getElementById('fSaveCustomer');
    if (saveCustomerBox && saveCustomerBox.checked){
      const exists = DATA.customers.some(c=> c.name===payload.client && c.phone===payload.phone);
      if(!exists){
        const { data: newCust, error: custErr } = await sb.from('customers').insert({ name:payload.client, phone:payload.phone, city:payload.city, address:payload.address }).select().single();
        if (!custErr && newCust) DATA.customers.unshift(newCust);
      }
    }
    toast('تم إنشاء الشحنة');
  }
  await refetch('shipments');
  closeModal();
  if (currentPage==='dashboard') renderTable();
  else if (currentPage==='trips' && currentTripId) renderTripDetail(currentTripId);
}

function logoImgTag(size){
  const logo = DATA.company.logo_url;
  return logo ? `<img src="${logo}" style="height:${size}px;max-width:${size*2.4}px;object-fit:contain;">` : '';

function makeQrDataUrl(text){
  try{
    if (typeof QRCode === 'undefined') return '';
    const holder = document.createElement('div');
    holder.style.position='fixed'; holder.style.left='-9999px'; holder.style.top='-9999px';
    document.body.appendChild(holder);
    new QRCode(holder, { text: text, width:130, height:130, correctLevel: QRCode.CorrectLevel.M });
    const canvas = holder.querySelector('canvas');
    const url = canvas ? canvas.toDataURL('image/png') : '';
    document.body.removeChild(holder);
    return url;
  } catch(e){ return ''; }
}

/* ================= Customers ================= */

            <button class="icon-btn" onclick="deleteCustomer('${c.id}')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 6h18"/><path d="M8 6V4a1 1 0 011-1h6a1 1 0 011 1v2"/><path d="M19 6l-1 14a1 1 0 01-1 1H7a1 1 0 01-1-1L5 6"/></svg></button>

function openCustomerModal(id){
  const editing = id ? DATA.customers.find(x=>x.id===id) : null;
  showModal(`
    <h3>${editing?'تعديل بيانات العميل':'إضافة عميل'}</h3>
    <div class="field"><label>الاسم</label><input id="cName" value="${editing?.name||''}"></div>
    <div class="field"><label>رقم الجوال</label><input id="cPhone" value="${editing?.phone||''}"></div>
    <div class="field"><label>المدينة</label><input id="cCity" value="${editing?.city||''}"></div>
    <div class="field"><label>العنوان بالتفصيل</label><textarea id="cAddress">${editing?.address||''}</textarea></div>
    <div class="modal-actions">
      <button class="btn" onclick="closeModal()">إلغاء</button>
      <button class="btn btn-primary" onclick="saveCustomer(${editing?`'${editing.id}'`:'null'})">${editing?'حفظ':'إضافة'}</button>
    </div>
  `);
}
async function saveCustomer(id){
  const name = document.getElementById('cName').value.trim();
  if(!name){ toast('اسم العميل مطلوب'); return; }
  const payload = { name, phone:document.getElementById('cPhone').value.trim(), city:document.getElementById('cCity').value.trim(), address:document.getElementById('cAddress').value.trim() };
  const { error } = id ? await sb.from('customers').update(payload).eq('id',id) : await sb.from('customers').insert(payload);
  if (error){ toast('خطأ: '+error.message); return; }
  await refetch('customers');
  closeModal(); renderCustomers();
  toast(id?'تم حفظ التعديلات':'تمت إضافة العميل');
}
async function deleteCustomer(id){
  if(!confirm('حذف هذا العميل من القائمة المحفوظة؟')) return;
  const { error } = await sb.from('customers').delete().eq('id', id);
  if (error){ toast('خطأ: '+error.message); return; }
  DATA.customers = DATA.customers.filter(x=>x.id!==id);
  renderCustomers(); toast('تم الحذف');
}

/* ================= Expenses ================= */
function renderExpenses(){
  const revenue = DATA.shipments.reduce((a,x)=>a+(Number(x.price)||0),0);
  const totalExpenses = DATA.expenses.reduce((a,e)=>a+(Number(e.amount)||0),0);
  const net = revenue - totalExpenses;
  const el = document.getElementById('pageContent');
  el.innerHTML = `
    <div class="stats-row">
      <div class="stat-card"><div class="bar" style="background:var(--blue)"></div><div class="num">${money(revenue)}</div><div class="lbl">إجمالي إيرادات الشحن</div></div>
      <div class="stat-card"><div class="bar" style="background:var(--danger)"></div><div class="num">${money(totalExpenses)}</div><div class="lbl">إجمالي المصاريف</div></div>
      <div class="stat-card"><div class="bar" style="background:${net>=0?'var(--green)':'var(--danger)'}"></div><div class="num">${money(net)}</div><div class="lbl">صافي الربح</div></div>
    </div>
    <div class="toolbar"><div></div><button class="btn btn-primary" onclick="openExpenseModal()">+ إضافة مصروف</button></div>
    <div class="panel"><div class="table-wrap" id="expTable"></div></div>
  `;
  renderExpenseTable();
}
function renderExpenseTable(){
  const list = [...DATA.expenses];
  const el = document.getElementById('expTable');
  if(!list.length){ el.innerHTML = emptyState('لا توجد مصاريف مسجلة بعد','سجّل مصاريف الوقود والجمارك والرسوم لمتابعة صافي الربح','+ إضافة مصروف','openExpenseModal()'); return; }
  el.innerHTML = `<table><thead><tr><th>التاريخ</th><th>الوصف</th><th>التصنيف</th><th>الرحلة</th><th>المبلغ</th><th></th></tr></thead><tbody>
    ${list.map(e=>{
      const trip = e.trip_id ? DATA.trips.find(t=>t.id===e.trip_id) : null;
      return `<tr>
      <td class="cell-muted">${fmtDate(e.date)}</td>
      <td>${e.description||'—'}</td>
      <td><span class="badge" style="background:var(--surface-3);color:var(--text-muted);">${EXP_CATEGORIES[e.category]||'أخرى'}</span></td>
      <td class="cell-muted">${trip?trip.number:'—'}</td>
      <td class="cell-strong">${money(e.amount)}</td>
      <td>
        <button class="icon-btn" onclick="openExpenseModal('${e.id}')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 013 3L7 19l-4 1 1-4 12.5-12.5z"/></svg></button>
        <button class="icon-btn" onclick="deleteExpense('${e.id}')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 6h18"/><path d="M8 6V4a1 1 0 011-1h6a1 1 0 011 1v2"/><path d="M19 6l-1 14a1 1 0 01-1 1H7a1 1 0 01-1-1L5 6"/></svg></button>
      </td>
    </tr>`;
    }).join('')}
  </tbody></table>`;
}
function openExpenseModal(id, presetTripId){
  const editing = id ? DATA.expenses.find(x=>x.id===id) : null;
  const catOpts = Object.entries(EXP_CATEGORIES).map(([k,v])=>`<option value="${k}" ${editing?.category===k?'selected':''}>${v}</option>`).join('');
  const tripId = (editing && editing.trip_id) || presetTripId || '';
  const tripOpts = `<option value="">بدون رحلة (مصروف عام)</option>` + DATA.trips.map(t=>`<option value="${t.id}" ${tripId===t.id?'selected':''}>${t.number} — ${fmtDate(t.date)}</option>`).join('');
  showModal(`
    <h3>${editing?'تعديل المصروف':'إضافة مصروف'}</h3>
    <div class="field"><label>التاريخ</label><input id="eDate" type="date" value="${editing?.date||todayForInput()}"></div>
    <div class="field"><label>الوصف</label><input id="eDesc" value="${editing?.description||''}" placeholder="مثال: تعبئة وقود، رسوم جمارك بورتسودان"></div>
    <div class="field-row">
      <div class="field"><label>التصنيف</label><select id="eCategory">${catOpts}</select></div>
      <div class="field"><label>المبلغ (ر.س)</label><input id="eAmount" type="number" min="0" value="${editing?.amount||''}"></div>
    </div>
    <div class="field"><label>الرحلة</label><select id="eTrip">${tripOpts}</select></div>
    <div class="modal-actions">
      <button class="btn" onclick="closeModal()">إلغاء</button>
      <button class="btn btn-primary" onclick="saveExpense(${editing?`'${editing.id}'`:'null'}, ${presetTripId?`'${presetTripId}'`:'null'})">${editing?'حفظ':'إضافة'}</button>
    </div>
  `);
}
async function saveExpense(id, presetTripId){
  const amount = Number(document.getElementById('eAmount').value)||0;
  if(amount<=0){ toast('أدخل مبلغًا صحيحًا'); return; }
  const payload = { date:document.getElementById('eDate').value||todayForInput(), description:document.getElementById('eDesc').value.trim(), category:document.getElementById('eCategory').value, amount, trip_id: document.getElementById('eTrip').value || null };
  const { error } = id ? await sb.from('expenses').update(payload).eq('id',id) : await sb.from('expenses').insert(payload);
  if (error){ toast('خطأ: '+error.message); return; }
  await refetch('expenses');
  closeModal();
  if (presetTripId) renderTripDetail(presetTripId); else renderExpenses();
  toast(id?'تم حفظ التعديلات':'تمت إضافة المصروف');
}
async function deleteExpense(id){
  if(!confirm('حذف هذا المصروف؟')) return;
  const { error } = await sb.from('expenses').delete().eq('id', id);
  if (error){ toast('خطأ: '+error.message); return; }
  DATA.expenses = DATA.expenses.filter(x=>x.id!==id);
  renderExpenses(); toast('تم الحذف');
}

/* ================= Trips ================= */
let currentTripId = null;
function tripStats(trip){
  const list = DATA.shipments.filter(x=> x.trip_id===trip.id);
  const weight = list.reduce((a,x)=>a+(Number(x.weight)||0),0);
  const pieces = list.reduce((a,x)=>a+(Number(x.pieces)||0),0);
  const revenue = list.reduce((a,x)=>a+(Number(x.price)||0),0);
  const expenses = DATA.expenses.filter(e=>e.trip_id===trip.id).reduce((a,e)=>a+(Number(e.amount)||0),0);
  return { list, weight, pieces, revenue, expenses, net: revenue-expenses };
}
function renderTrips(){
  currentTripId = null;
  const el = document.getElementById('pageContent');
  const unassigned = DATA.shipments.filter(x=>!x.trip_id).length;
  const toolbar = `<div class="toolbar">
    <div class="cell-muted">${unassigned ? unassigned+' شحنة غير مرتبطة بأي رحلة بعد' : 'كل الشحنات مرتبطة برحلة'}</div>
    <button class="btn btn-primary" onclick="openTripModal()">+ رحلة جديدة</button>
  </div>`;
  if (!DATA.trips.length){ el.innerHTML = toolbar + emptyState('لا توجد رحلات بعد','أنشئ رحلة واجمع فيها شحنات الشاحنة القادمة','+ رحلة جديدة','openTripModal()'); return; }
  el.innerHTML = toolbar + `<div class="card-grid">
    ${DATA.trips.map(t=>{
      const s = tripStats(t);
      const st = TRIP_STATUS[t.status]||TRIP_STATUS.preparing;
      return `<div class="panel" style="padding:16px; cursor:pointer;" onclick="renderTripDetail('${t.id}')">
        <div style="display:flex; justify-content:space-between; align-items:center;">
          <div class="mono cell-strong" style="font-size:15px;">${t.number}</div>
          <span class="badge" style="background:${st.soft};color:${st.color}"><span class="dot" style="background:${st.color}"></span>${st.label}</span>
        </div>
        <div class="cell-muted" style="margin-top:4px;">${fmtDate(t.date)}</div>
        <div style="display:flex; justify-content:space-between; margin-top:12px; padding-top:10px; border-top:1px dashed var(--border); font-size:12.5px;"><span class="cell-muted">الشحنات</span><b>${s.list.length}</b></div>
        <div style="display:flex; justify-content:space-between; font-size:12.5px; margin-top:4px;"><span class="cell-muted">الوزن</span><b>${s.weight} كجم</b></div>
        <div style="display:flex; justify-content:space-between; font-size:12.5px; margin-top:4px;"><span class="cell-muted">صافي الربح</span><b style="color:${s.net>=0?'var(--green)':'var(--danger)'}">${money(s.net)}</b></div>
      </div>`;
    }).join('')}
  </div>`;
}
function openTripModal(){
  showModal(`
    <h3>رحلة جديدة</h3>
    <div class="modal-sub">سيُنشأ رقم رحلة تلقائيًا — تقدر تضيف الشحنات بعد الإنشاء</div>
    <div class="field"><label>تاريخ الانطلاق</label><input id="tDate" type="date" value="${todayForInput()}"></div>
    <div class="modal-actions">
      <button class="btn" onclick="closeModal()">إلغاء</button>
      <button class="btn btn-primary" onclick="createTrip()">إنشاء الرحلة</button>
    </div>
  `);
}
async function createTrip(){
  const date = document.getElementById('tDate').value || todayForInput();
  const payload = { number: nextTripNumberVal(), date, status:'preparing' };
  const { data, error } = await sb.from('trips').insert(payload).select().single();
  if (error){ toast('خطأ: '+error.message); return; }
  await refetch('trips');
  closeModal();
  renderTripDetail(data.id);
  toast('تم إنشاء الرحلة');
}
function renderTripDetail(tripId){
  currentTripId = tripId;
  const trip = DATA.trips.find(t=>t.id===tripId);
  if(!trip){ renderTrips(); return; }
  const s = tripStats(trip);
  const available = DATA.shipments.filter(x=>!x.trip_id || x.trip_id===tripId);
  const inTrip = available.filter(x=>x.trip_id===tripId);
  const notInTrip = available.filter(x=>x.trip_id!==tripId);
  const tripExpenses = DATA.expenses.filter(e=>e.trip_id===tripId);
  const statusOpts = TRIP_STATUS_ORDER.map(k=>`<option value="${k}" ${k===trip.status?'selected':''}>${TRIP_STATUS[k].label}</option>`).join('');
  document.getElementById('pageContent').innerHTML = `
    <button class="btn btn-ghost" style="margin-bottom:14px;" onclick="renderTrips()">→ رجوع لكل الرحلات</button>
    <div class="toolbar">
      <div><div class="mono cell-strong" style="font-size:18px;">${trip.number}</div><div class="cell-muted">${fmtDate(trip.date)}</div></div>
      <div style="display:flex; gap:8px; align-items:center;">
        <select class="status-select" onchange="updateTripStatus('${trip.id}', this.value)" style="background:${TRIP_STATUS[trip.status].soft};color:${TRIP_STATUS[trip.status].color};">${statusOpts}</select>
        <button class="btn" onclick="printTripManifest('${trip.id}')">🖨 طباعة كشف التحميل</button>
        <button class="btn btn-danger-ghost" onclick="deleteTrip('${trip.id}')">حذف الرحلة</button>
      </div>
    </div>
    <div class="stats-row">
      <div class="stat-card"><div class="bar" style="background:var(--blue)"></div><div class="num">${s.list.length}</div><div class="lbl">عدد الشحنات</div></div>
      <div class="stat-card"><div class="bar" style="background:var(--accent)"></div><div class="num">${s.weight} كجم</div><div class="lbl">إجمالي الوزن</div></div>
      <div class="stat-card"><div class="bar" style="background:var(--blue)"></div><div class="num">${money(s.revenue)}</div><div class="lbl">إيرادات الرحلة</div></div>
      <div class="stat-card"><div class="bar" style="background:var(--danger)"></div><div class="num">${money(s.expenses)}</div><div class="lbl">مصاريف الرحلة</div></div>
      <div class="stat-card"><div class="bar" style="background:${s.net>=0?'var(--green)':'var(--danger)'}"></div><div class="num">${money(s.net)}</div><div class="lbl">صافي الربح</div></div>
    </div>
    <div class="grid-2" style="display:grid; grid-template-columns:1.2fr 1fr; gap:16px;">
      <div class="panel">
        <div style="padding:14px 16px; border-bottom:1px solid var(--border); font-weight:700; font-size:14px;">شحنات الرحلة (${inTrip.length})</div>
        <div class="table-wrap">${inTrip.length ? `<table><thead><tr><th>التتبع</th><th>المستلم</th><th>المدينة</th><th>الوزن</th><th></th></tr></thead><tbody>
          ${inTrip.map(x=>`<tr><td class="mono cell-strong">${x.tracking}</td><td>${x.client}</td><td>${x.city}</td><td>${x.weight||0} كجم</td><td><button class="icon-btn" title="إزالة من الرحلة" onclick="removeShipmentFromTrip('${trip.id}','${x.id}')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M18 6L6 18M6 6l12 12"/></svg></button></td></tr>`).join('')}
        </tbody></table>` : `<div class="empty-state" style="padding:26px;">لسه مفيش شحنات مضافة</div>`}</div>
      </div>
      <div class="panel">
        <div style="padding:14px 16px; border-bottom:1px solid var(--border); font-weight:700; font-size:14px;">شحنات متاحة للإضافة (${notInTrip.length})</div>
        <div class="table-wrap">${notInTrip.length ? `<table><thead><tr><th>التتبع</th><th>المستلم</th><th></th></tr></thead><tbody>
          ${notInTrip.map(x=>`<tr><td class="mono cell-strong">${x.tracking}</td><td>${x.client}</td><td><button class="icon-btn" title="إضافة للرحلة" onclick="addShipmentToTrip('${trip.id}','${x.id}')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 5v14M5 12h14"/></svg></button></td></tr>`).join('')}
        </tbody></table>` : `<div class="empty-state" style="padding:26px;">مفيش شحنات تانية متاحة</div>`}</div>
      </div>
    </div>
    <div style="height:16px;"></div>
    <div class="panel">
      <div style="padding:14px 16px; border-bottom:1px solid var(--border); display:flex; justify-content:space-between; align-items:center;">
        <div style="font-weight:700; font-size:14px;">مصاريف هذه الرحلة</div>
        <button class="btn" style="padding:6px 12px; font-size:12px;" onclick="openExpenseModal(null, '${trip.id}')">+ إضافة مصروف</button>
      </div>
      <div class="table-wrap">${tripExpenses.length ? `<table><thead><tr><th>التاريخ</th><th>الوصف</th><th>التصنيف</th><th>المبلغ</th></tr></thead><tbody>
        ${tripExpenses.map(e=>`<tr><td class="cell-muted">${fmtDate(e.date)}</td><td>${e.description||'—'}</td><td>${EXP_CATEGORIES[e.category]||'أخرى'}</td><td class="cell-strong">${money(e.amount)}</td></tr>`).join('')}
      </tbody></table>` : `<div class="empty-state" style="padding:22px;">لا توجد مصاريف مسجلة لهذه الرحلة</div>`}</div>
    </div>
  `;
}
async function addShipmentToTrip(tripId, shipmentId){
  const { error } = await sb.from('shipments').update({trip_id:tripId}).eq('id', shipmentId);
  if (error){ toast('خطأ: '+error.message); return; }
  const ship = DATA.shipments.find(x=>x.id===shipmentId); if (ship) ship.trip_id = tripId;
  renderTripDetail(tripId);
}
async function removeShipmentFromTrip(tripId, shipmentId){
  const { error } = await sb.from('shipments').update({trip_id:null}).eq('id', shipmentId);
  if (error){ toast('خطأ: '+error.message); return; }
  const ship = DATA.shipments.find(x=>x.id===shipmentId); if (ship) ship.trip_id = null;
  renderTripDetail(tripId);
}
async function updateTripStatus(tripId, status){
  const { error } = await sb.from('trips').update({status}).eq('id', tripId);
  if (error){ toast('خطأ: '+error.message); return; }
  const trip = DATA.trips.find(t=>t.id===tripId); if (trip) trip.status = status;
  toast('تم تحديث حالة الرحلة');
  renderTripDetail(tripId);
}
async function deleteTrip(tripId){
  const trip = DATA.trips.find(t=>t.id===tripId); if(!trip) return;
  if(!confirm(`حذف ${trip.number}؟ الشحنات هتفضل موجودة بس هتبقى غير مرتبطة بأي رحلة.`)) return;
  await sb.from('shipments').update({trip_id:null}).eq('trip_id', tripId);
  const { error } = await sb.from('trips').delete().eq('id', tripId);
  if (error){ toast('خطأ: '+error.message); return; }
  await refetch('shipments'); await refetch('trips');
  renderTrips();
  toast('تم حذف الرحلة');
}

  const c = DATA.company;

    <div style="max-width:760px; margin:0 auto; padding:26px; color:#111;">
      <div style="text-align:center; border-bottom:2px solid #111; padding-bottom:14px; margin-bottom:16px;">
        ${c.logo_url ? `<div style="margin-bottom:6px;">${logoImgTag(80)}</div>` : ''}
        <div style="font-size:19px; font-weight:800;">${c.name||'شركة النقل'}</div>
        <div style="font-size:12px; color:#555;">كشف تحميل — ${trip.number} — ${fmtDate(trip.date)}</div>
      </div>
      <table style="width:100%; border-collapse:collapse; font-size:12.5px;">
        <thead><tr style="border-bottom:2px solid #111;">
          <th style="text-align:right; padding:7px 4px;">رقم التتبع</th><th style="text-align:right; padding:7px 4px;">المستلم</th><th style="text-align:right; padding:7px 4px;">المدينة</th><th style="text-align:right; padding:7px 4px;">الوزن</th><th style="text-align:right; padding:7px 4px;">القطع</th><th style="text-align:right; padding:7px 4px;">القيمة</th>
        </tr></thead>
        <tbody>${s.list.map(x=>`<tr style="border-bottom:1px solid #ddd;"><td style="padding:7px 4px; font-family:monospace;">${x.tracking}</td><td style="padding:7px 4px;">${x.client}</td><td style="padding:7px 4px;">${x.city}</td><td style="padding:7px 4px;">${x.weight||0} كجم</td><td style="padding:7px 4px;">${x.pieces||1}</td><td style="padding:7px 4px;">${money(x.price)}</td></tr>`).join('')}</tbody>
        <tfoot><tr style="border-top:2px solid #111; font-weight:800;">
          <td style="padding:9px 4px;" colspan="3">الإجمالي (${s.list.length} شحنة)</td><td style="padding:9px 4px;">${s.weight} كجم</td><td style="padding:9px 4px;">${s.pieces}</td><td style="padding:9px 4px;">${money(s.revenue)}</td>
        </tr></tfoot>

        <div style="width:45%; border-top:1px solid #999; padding-top:6px;">توقيع المسؤول</div>
      </div>
    </div>`;
  openPrintWindow(body, 'كشف تحميل — ' + trip.number);
}

/* ================= Settings ================= */

  document.getElementById('pageContent').innerHTML = `

        <h3 style="margin-top:0;">بيانات الشركة</h3>
        <div class="modal-sub">تظهر هذه البيانات في السند والملصق</div>
        <div class="field"><label>اسم الشركة / اسمك</label><input id="sCompany" value="${c.name||''}"></div>
        <div class="field"><label>رقم الجوال</label><input id="sPhone" value="${c.phone||''}"></div>
        <div class="field"><label>مدينة الانطلاق الافتراضية (السعودية)</label><input id="sOrigin" value="${c.origin_city||''}"></div>
        <div class="field">
          <label>شعار الشركة (اختياري)</label>
          <div style="display:flex; align-items:center; gap:12px;">
            <img id="logoPreview" class="logo-preview" src="${c.logo_url||''}" style="${c.logo_url?'':'display:none;'}">
            <div id="logoPlaceholder" class="logo-preview" style="${c.logo_url?'display:none;':'display:flex;'}align-items:center;justify-content:center;color:var(--text-muted);font-size:10px;">بدون شعار</div>
            <div style="display:flex; flex-direction:column; gap:6px;">
              <input type="file" id="sLogo" accept="image/*" style="font-size:12px;">
              ${c.logo_url?`<button class="btn btn-ghost" style="padding:4px 8px;font-size:11.5px;" onclick="removeLogo()">إزالة الشعار</button>`:''}
            </div>
          </div>
        </div>
        <button class="btn btn-primary" onclick="saveCompany()">حفظ بيانات الشركة</button>
      </div>
      <div class="panel" style="padding:18px;">
        <h3 style="margin-top:0;">تغيير كلمة السر</h3>
        <div class="modal-sub">الحساب مربوط بالبريد: ${sb.auth.getUser ? '' : ''}<span id="currentEmail">...</span></div>
        <div class="field"><label>كلمة السر الجديدة</label><input id="sPass" type="password" placeholder="6 أحرف على الأقل"></div>
        <button class="btn btn-primary" onclick="saveCredentials()">تحديث كلمة السر</button>
      </div>
    </div>
    <div style="height:16px;"></div>
    <div class="panel" style="padding:18px;">
      <h3 style="margin-top:0;">نسخة احتياطية</h3>
      <div class="modal-sub">حمّل نسخة من بياناتك كملف — بياناتك أصلًا محفوظة بأمان في السحابة، وده للاطمئنان الإضافي فقط</div>
      <button class="btn" style="width:auto;" onclick="exportBackup()">⬇ تصدير نسخة احتياطية</button>

    <div class="panel" style="padding:18px;">

      <div class="modal-sub">لو عندك ملف نسخة احتياطية من النسخة المحلية القديمة (قبل ربطها بالسحابة)، ارفعه هنا وهتتضاف بياناته هنا</div>
      <label class="btn" style="width:auto; cursor:pointer;">⬆ اختيار ملف واستيراد<input type="file" id="importFile" accept="application/json" style="display:none;"></label>

    <div class="panel" style="padding:18px;">

async function saveCompany(){
  const payload = { id:1, name:document.getElementById('sCompany').value.trim(), phone:document.getElementById('sPhone').value.trim(), origin_city:document.getElementById('sOrigin').value.trim() };
  const { error } = await sb.from('company_settings').upsert(payload);
  if (error){ toast('خطأ: '+error.message); return; }
  Object.assign(DATA.company, payload);
  updateBrand();
  toast('تم حفظ بيانات الشركة');
}
function updateBrand(){
  document.getElementById('brandName').textContent = DATA.company.name || 'شركة النقل';
  const mark = document.getElementById('brandMark');
  if (DATA.company.logo_url){
    mark.classList.add('has-logo');
    mark.innerHTML = `<img src="${DATA.company.logo_url}">`;
  } else {
    mark.classList.remove('has-logo');
    mark.innerHTML = `<svg viewBox="0 0 24 24" fill="none"><path d="M3 12l7-8 4 4-7 8-4-4z" stroke="#241705" stroke-width="1.8" stroke-linejoin="round"/><path d="M13 9l3-3 5 5-3 3" stroke="#241705" stroke-width="1.8" stroke-linejoin="round"/></svg>`;
  }
}
function handleLogoUpload(input){
  const file = input.files && input.files[0];
  if(!file) return;
  if(!file.type.startsWith('image/')){ toast('اختر ملف صورة'); return; }
  const reader = new FileReader();
  reader.onload = function(e){
    const img = new Image();
    img.onload = async function(){
      const maxSize = 400;
      let { width, height } = img;
      if (width > height && width > maxSize){ height = Math.round(height * maxSize/width); width = maxSize; }
      else if (height > maxSize){ width = Math.round(width * maxSize/height); height = maxSize; }
      const canvas = document.createElement('canvas');
      canvas.width = width; canvas.height = height;
      canvas.getContext('2d').drawImage(img, 0, 0, width, height);
      const dataUrl = canvas.toDataURL('image/png', 0.85);
      const { error } = await sb.from('company_settings').upsert({ id:1, logo_url: dataUrl });
      if (error){ toast('خطأ: '+error.message); return; }
      DATA.company.logo_url = dataUrl;
      updateBrand();
      renderSettings();
      toast('تم حفظ الشعار');
    };
    img.onerror = function(){ toast('تعذّر قراءة الصورة'); };
    img.src = e.target.result;
  };
  reader.onerror = function(){ toast('تعذّر قراءة الملف'); };
  reader.readAsDataURL(file);
}
async function removeLogo(){
  const { error } = await sb.from('company_settings').upsert({ id:1, logo_url: null });
  if (error){ toast('خطأ: '+error.message); return; }
  DATA.company.logo_url = '';
  updateBrand();
  renderSettings();
  toast('تم إزالة الشعار');
}
async function saveCredentials(){
  const pass = document.getElementById('sPass').value;
  if (!pass || pass.length<6){ toast('كلمة السر يجب أن تكون 6 أحرف على الأقل'); return; }
  const { error } = await sb.auth.updateUser({ password: pass });
  if (error){ toast('خطأ: '+error.message); return; }
  toast('تم تحديث كلمة السر');
}
function exportBackup(){
  const payload = JSON.stringify({ company:DATA.company, shipments:DATA.shipments, customers:DATA.customers, expenses:DATA.expenses, trips:DATA.trips, exportedAt:new Date().toISOString() }, null, 2);
  const blob = new Blob([payload], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'نسخة-احتياطية-الشحنات.json';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
  toast('تم تحميل النسخة الاحتياطية');
}
function handleImportBackup(input){
  const file = input.files && input.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = async function(e){
    let parsed;
    try{ parsed = JSON.parse(e.target.result); } catch(err){ toast('الملف غير صالح'); input.value=''; return; }
    if(!confirm('هيتم إضافة كل بيانات الملف كشحنات ورحلات وعملاء جديدة (مش استبدال). متابعة؟')){ input.value=''; return; }
    toast('جارِ الاستيراد... ده ممكن ياخد لحظات');
    try{
      if (parsed.company && (parsed.company.name || parsed.company.logo)){
        await sb.from('company_settings').upsert({
          id:1,
          name: parsed.company.name || DATA.company.name,
          phone: parsed.company.phone || DATA.company.phone,
          origin_city: parsed.company.originCity || DATA.company.origin_city,
          logo_url: parsed.company.logo || DATA.company.logo_url,
        });
      }
      const tripMap = {};
      if (Array.isArray(parsed.trips)){
        for (const t of parsed.trips){
          if(!t || !t.number) continue;
          const { data, error } = await sb.from('trips').insert({ number:t.number, date:t.date||todayForInput(), status:t.status||'preparing' }).select().single();
          if (!error && data) tripMap[t.id] = data.id;
        }
      }
      if (Array.isArray(parsed.customers)){
        for (const c of parsed.customers){
          if(!c || !c.name) continue;
          await sb.from('customers').insert({ name:c.name, phone:c.phone||'', city:c.city||'', address:c.address||'' });
        }
      }
      let importedShipments = 0;
      if (Array.isArray(parsed.shipments)){
        for (const s of parsed.shipments){
          if(!s || !s.client || !s.city) continue;
          const payload = {
            tracking: s.tracking || nextTrackingNumber(),
            client: s.client, phone: s.phone||'',
            sender_name: s.senderName||'', sender_phone: s.senderPhone||'',
            origin: s.origin||'', city: s.city, address: s.address||'',
            description: s.desc||'', weight: Number(s.weight)||0, pieces: Number(s.pieces)||1,
            price: Number(s.price)||0, payment: s.payment||'paid', status: s.status||'preparing',
            pickup_at: s.pickupAt ? new Date(s.pickupAt).toISOString() : null,
            eta: s.eta || null,
            trip_id: s.tripId ? (tripMap[s.tripId]||null) : null,
            delivered_at: s.deliveredAt || null,
          };
          if (s.createdAt) payload.created_at = s.createdAt;
          const { error } = await sb.from('shipments').insert(payload);
          if (!error) importedShipments++;
        }
      }
      if (Array.isArray(parsed.expenses)){
        for (const ex of parsed.expenses){
          if(!ex || !ex.amount) continue;
          await sb.from('expenses').insert({ date: ex.date||todayForInput(), description: ex.desc||'', category: ex.category||'other', amount: Number(ex.amount)||0, trip_id: ex.tripId ? (tripMap[ex.tripId]||null) : null });
        }
      }
      await loadAllData();
      updateBrand();
      goto(currentPage);
      toast(`تم الاستيراد — ${importedShipments} شحنة أُضيفت`);
    } catch(err){ toast('حصل خطأ أثناء الاستيراد: '+err.message); }
    input.value = '';
  };
  reader.onerror = function(){ toast('تعذّر قراءة الملف'); };
  reader.readAsText(file);
}

/* ================= Modal / theme ================= */
function showModal(html){ document.getElementById('modalBox').innerHTML = html; document.getElementById('overlay').classList.add('open'); }
function closeModal(){ document.getElementById('overlay').classList.remove('open'); }
document.getElementById('overlay').addEventListener('click', e=>{ if(e.target.id==='overlay') closeModal(); });
document.addEventListener('keydown', e=>{ if(e.key==='Escape') closeModal(); });

let themeMode='auto';
try{ themeMode = localStorage.getItem('sd_theme')||'auto'; }catch(e){}
function applyTheme(){
  document.documentElement.removeAttribute('data-theme');
  if(themeMode==='dark') document.documentElement.setAttribute('data-theme','dark');
  if(themeMode==='light') document.documentElement.setAttribute('data-theme','light');
}
document.getElementById('themeBtn').addEventListener('click', ()=>{
  themeMode = themeMode==='auto'?'dark':themeMode==='dark'?'light':'auto';
  try{ localStorage.setItem('sd_theme', themeMode); }catch(e){}
  applyTheme();
});
applyTheme();

/* ================= Init ================= */
(async function init(){
  const { data } = await sb.auth.getSession();
  document.getElementById('loadingVeil').style.display='none';
  if (data.session){ afterAuth(); }
  else { renderLogin('login'); }
})();
sb.auth.onAuthStateChange((event)=>{
  if (event === 'SIGNED_OUT'){
    document.getElementById('app').classList.remove('show');
    renderLogin('login');
  }
});
</script>
